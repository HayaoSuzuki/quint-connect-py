name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUSTUP_TOOLCHAIN: '1.100.0'

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.10'
          enable-cache: false
      - name: Check workflow syntax and shell scripts
        run: |
          uvx --python 3.14 --from actionlint-py==1.7.12.25 --with shellcheck-py==0.11.0.1 actionlint
          uvx --python 3.14 --from shellcheck-py==0.11.0.1 shellcheck .github/scripts/install-quint.sh
      - name: Audit workflows
        run: uvx --python 3.14 --from zizmor==1.32.0 zizmor --offline --persona auditor .github/workflows

  lint:
    name: Python and Rust lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.10'
          enable-cache: false
      - name: Install lint and test dependencies
        run: uv sync --locked --group lint --group test --no-install-project
      - run: uv run --locked --no-sync ruff format --check
      - run: uv run --locked --no-sync ruff check --no-fix
      - run: uv run --locked --no-sync ty check
      - name: Install Rust lint components
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --component rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}

  rust-test:
    name: Rust and Quint tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install Quint and its Rust evaluator
        run: bash .github/scripts/install-quint.sh
      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - run: cargo test --locked --no-default-features
      - run: cargo test --locked --all-features
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}
      - name: Run upstream quint-connect reference tests
        run: cargo test --locked --test upstream_reference -- --ignored
      - name: Check Quint conformance fixtures with both evaluators
        run: python tools/export_quint_fixtures.py --check
      - name: Run Quint model tests with both evaluators
        shell: bash
        run: |
          for backend in rust typescript; do
            for test_file in spec/*_test.qnt; do
              quint test "$test_file" --backend="$backend" --match='Test$' --seed=42
            done
          done

  python-test:
    name: Python tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.14', '3.15']
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: ${{ matrix.python == '3.15' }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.10'
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install Quint and its Rust evaluator
        run: bash .github/scripts/install-quint.sh
      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Build the extension and install test dependencies
        run: uv sync --locked --group test
      - name: Run pytest with Quint on PATH
        run: |
          quint --version
          uv run --locked --no-sync pytest -q

[build-system]
requires = ["maturin>=1.11,<2"]
build-backend = "maturin"

[project]
name = "quint-connect-py"
version = "0.2.1"
description = "Replay Quint model traces against Python code"
readme = "README.md"
requires-python = ">=3.14,<3.16"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
]

[project.urls]
Repository = "https://github.com/HayaoSuzuki/quint-connect-py"
Issues = "https://github.com/HayaoSuzuki/quint-connect-py/issues"

[dependency-groups]
test = ["pytest>=9", "pytest-xdist", "hypothesis"]
lint = ["ruff", "ty"]
release = ["pydantic>=2,<3", "pypi-attestations==0.0.31", "twine==6.2.0"]

[tool.uv]
# Editable wheels also depend on native sources and the public Python types.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
    { file = "python/**/*.py" },
    { file = "python/**/*.pyi" },
    { file = "python/quint_connect/py.typed" },
    { file = "LICENSE" },
    { file = "README.md" },
]

[tool.maturin]
bindings = "pyo3"
python-source = "python"
module-name = "quint_connect._native"
features = ["python"]

[tool.ruff]
target-version = "py314"
line-length = 88
force-exclude = true

[tool.ruff.per-file-target-version]
"tools/export_quint_fixtures.py" = "py310"

[tool.ruff.lint]
select = ["ALL"]
# Formatting rules that conflict with Ruff's formatter.
ignore = ["COM812", "CPY001", "ISC001", "TC001", "TC002", "TC003", "TRY003"]
unfixable = ["F401"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D", "FBT003", "INP001", "PLR2004", "S101"]
# The fixture CLI runs the requested local adapter and prints verification results.
"tools/export_quint_fixtures.py" = ["INP001", "S603", "S607", "T201"]
"tools/check_wheel.py" = ["INP001"]
"tools/verify_release.py" = ["INP001"]
"**/*.pyi" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.14"
python-platform = "all"
root = ["python"]

[tool.ty.rules]
all = "error"

[tool.ty.analysis]
respect-type-ignore-comments = false
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
minversion = "9.0"
strict = true
empty_parameter_set_mark = "fail_at_collect"
testpaths = ["tests"]

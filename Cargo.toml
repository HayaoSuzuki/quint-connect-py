[package]
name = "quint-connect-py"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "_native"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
getrandom = "0.4"
num-bigint = "0.5"
pyo3 = { version = "0.30", features = ["abi3-py314", "extension-module"], optional = true }
serde_json = "1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = "1"
rstest = "0.29"
quint-connect-reference = { package = "quint-connect", version = "=0.1.2" }

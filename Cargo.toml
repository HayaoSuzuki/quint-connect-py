[package]
name = "quint-connect-py"
version = "0.2.1"
description = "Replay Quint model traces against Python code"
repository = "https://github.com/HayaoSuzuki/quint-connect-py"
readme = "README.md"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "_native"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
getrandom = "0.4"
num-bigint = "0.5"
pyo3 = { version = "0.30", features = ["abi3-py314"], optional = true }
serde_json = "1"
stacker = "0.1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = "1"
rstest = "0.29"
quint-connect = "=0.1.2"
anyhow = "1"
serde = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
